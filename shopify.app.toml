# Learn more about working with Shopify TOML files with Gadget at https://docs.gadget.dev/guides/plugins/shopify/advanced-topics/shopify-app-toml

client_id = "b73a7f59b61391d5901163e77050f8c8"
name = "domaine-shop-gateway"
application_url = "https://domaine-shop-gateway.gadget.app/api/shopify/install-or-render"
embedded = true

[auth]
redirect_urls = [ "https://domaine-shop-gateway.gadget.app/api/connections/auth/shopify/callback" ]

[access_scopes]
scopes = "read_products, write_products, read_metaobjects, write_metaobjects, unauthenticated_read_metaobjects, read_metaobject_definitions, write_metaobject_definitions, read_themes, read_publications, read_inventory, read_inventory_shipments, read_inventory_shipments_received_items, read_inventory_transfers, unauthenticated_read_product_inventory, read_locations, unauthenticated_read_product_pickup_locations, read_markets, read_markets_home"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://webhooks.gadget-services.net/shopify/v1?domain=domaine-shop-gateway.gadget.app"
topics = [ "shop/update", "app/uninstalled" ]
